name: Verify Pantry Relay
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pantry_ci
          POSTGRES_DB: pantry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pantry_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PANTRY_TEST_POSTGRES: postgresql://postgres:pantry_ci@127.0.0.1:5432/pantry_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check backend tests scripts/account_admin.py scripts/backup.py
      - run: uv run pytest
      - run: npm ci && npm run build
        working-directory: frontend
      - run: ./scripts/test_browser.sh
      - run: docker build -t pantry-relay:ci .
